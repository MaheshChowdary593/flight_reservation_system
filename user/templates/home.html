<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Reservation - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <style>
        /* Golden calendar icon for date input, only icon is styled */
        .custom-date-picker {
            position: relative;
        }
        .custom-date-picker::-webkit-calendar-picker-indicator {
            opacity: 0;
            width: 28px;
            height: 28px;
            cursor: pointer;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .custom-date-picker:after {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="%23FFD700" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM7 12h5v5H7z"/></svg>');
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            transition: filter 0.3s, transform 0.3s;
            z-index: 1;
        }
        .custom-date-picker:hover:after,
        .custom-date-picker:focus:after {
            filter: drop-shadow(0 0 6px #FFD700);
            transform: translateY(-50%) scale(1.1) rotate(-8deg);
        }
        /* Responsive cards */
        .features-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }
        .card-3d-wrap {
            min-width: 320px;
            max-width: 350px;
            margin: 1rem;
        }
        @media (max-width: 900px) {
            .features-cards {
                flex-direction: column;
                align-items: center;
            }
            .card-3d-wrap {
                min-width: 90vw;
                max-width: 95vw;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
<nav class="navbar">
    <div class="navbar-container">
        <a href="{{ url_for('home') }}" class="navbar-logo">FlightReserve</a>
        <ul class="navbar-menu">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
        </ul>
    </div>
</nav>

    <div class="section">
        <div class="container">
            <div class="row full-height justify-content-center">
                <div class="col-12 text-center align-self-center py-5">
                    <div class="section pb-5 pt-5 pt-sm-2 text-center">
                        <div class="top-right-nav mb-4">
                            <a href="{{ url_for('logout') }}" class="btn btn-light">Logout</a>
                        </div>
                        <h2 class="mb-4">Welcome, {{ session.fullname or 'User' }}!</h2>
                        <div class="features-cards">
                            <!-- Search Flights Card -->
                            <div class="card-3d-wrap mx-3 my-2">
                                <div class="card-3d-wrapper">
                                    <div class="card-front feature-card">
                                        <div class="center-wrap">
                                            <div class="section text-center">
                                                <h4 class="mb-4 pb-3">Search Flights</h4>
                                                <form action="{{ url_for('search_flights') }}" method="GET">
                                                    <div class="form-group mb-2">
                                                        <input type="text" name="from" class="form-style" placeholder="From" required>
                                                    </div>
                                                    <div class="form-group mb-2">
                                                        <input type="text" name="to" class="form-style" placeholder="To" required>
                                                    </div>
                                                    <div class="form-group mb-2">
                                                        <input type="date" name="date" class="form-style custom-date-picker" required>
                                                    </div>
                                                    <button type="submit" class="btn mt-2">Search</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Manage Bookings Card -->
                            <div class="card-3d-wrap mx-3 my-2">
                                <div class="card-3d-wrapper">
                                    <div class="card-front feature-card">
                                        <div class="center-wrap">
                                            <div class="section text-center">
                                                <h4 class="mb-4 pb-3">Manage Bookings</h4>
                                                <form action="{{ url_for('manage_bookings') }}" method="GET">
                                                    <div class="form-group mb-2">
                                                        <input type="text" name="booking_ref" class="form-style" placeholder="Booking Reference" required>
                                                    </div>
                                                    <button type="submit" class="btn mt-2">View Booking</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Check-In Card -->
                            <div class="card-3d-wrap mx-3 my-2">
                                <div class="card-3d-wrapper">
                                    <div class="card-front feature-card">
                                        <div class="center-wrap">
                                            <div class="section text-center">
                                                <h4 class="mb-4 pb-3">Check-In</h4>
                                                <form method="POST" action="{{ url_for('check_in') }}" >
                                                    <div class="form-group mb-2">
                                                        <input type="text" name="booking_ref" class="form-style" placeholder="Booking Reference" required>
                                                    </div>
                                                    <button type="submit" class="btn mt-2">Check-In</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- View All Bookings Card -->
                            <div class="card-3d-wrap mx-3 my-2">
                                <div class="card-3d-wrapper">
                                    <div class="card-front feature-card">
                                        <div class="center-wrap">
                                            <div class="section text-center">
                                                <h4 class="mb-4 pb-3">Your Bookings</h4>
                                                <p class="mb-3">View all your flight reservations in one place.</p>
                                                <a href="{{ url_for('my_bookings') }}" class="btn mt-2">View My Bookings</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- End of cards -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
