<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer>
    function validateEmail() {
        let emailField = document.getElementById("email");
        let errorMsg = document.getElementById("email-error");
        let resetBtn = document.getElementById("reset-btn");
        let email = emailField.value.trim();
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (!emailPattern.test(email)) {
            emailField.style.border = "2px solid red";
            errorMsg.innerText = "Enter a valid email address";
            resetBtn.disabled = true;
            resetBtn.classList.add("disabled");
            return false;
        }

        emailField.style.border = "2px solid green";
        errorMsg.innerText = "";
        resetBtn.disabled = false;
        resetBtn.classList.remove("disabled");
        return true;
    }
  </script>
  <title>Forgot Password</title>
</head>
<body>
  <div class="section">
    <div class="container">
      <div class="row full-height justify-content-center">
        <div class="col-12 text-center align-self-center py-5">
          <div class="card-3d-wrap mx-auto">
            <div class="card-3d-wrapper">
              <div class="card-front">
                <div class="center-wrap">
                  <div class="section text-center">
                    <h4 class="mb-4 pb-3">Forgot Password</h4>
                    <small id="email-error" class="text-danger"></small>
                    <div class="form-group">
                      <input type="email" class="form-style" placeholder="Enter your Email" id="email" oninput="validateEmail()">
                    </div>
                    <a href="#" class="btn mt-4 disabled" id="reset-btn">Send Reset Link</a>
                  </div>
                </div>
              </div> <!-- card-front -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
